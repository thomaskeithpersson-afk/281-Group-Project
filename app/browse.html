<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Listings - BookExchange</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Book<span>Exchange</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="browse.html" class="active">Browse</a>
      <a href="post.html" class="btn-nav">+ Post a Book</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-header-inner">
      <h1>Browse Listings</h1>
      <p>Find textbooks by course code or title.</p>
    </div>
  </div>

  <div class="container">

    <!-- Search & Filters -->
    <div class="search-bar">
      <input
        type="search"
        id="search-input"
        placeholder="Search by course code or book title..."
        autocomplete="off"
        aria-label="Search listings"
      >
      <select id="condition-select" aria-label="Filter by condition">
        <option value="all">All Conditions</option>
        <option value="New">New</option>
        <option value="Like New">Like New</option>
        <option value="Good">Good</option>
        <option value="Fair">Fair</option>
        <option value="Poor">Poor</option>
      </select>
      <select id="filter-select" aria-label="Filter by availability">
        <option value="all">All Listings</option>
        <option value="available">Available Only</option>
        <option value="sold">Sold Only</option>
      </select>
    </div>

    <!-- Toolbar -->
    <div class="browse-toolbar">
      <span class="results-count" id="results-count"></span>
      <a href="post.html" class="btn btn-primary btn-sm">+ Post a Book</a>
    </div>

    <!-- Listings -->
    <div class="listings-grid" id="listings-grid">
      <!-- Populated by script.js -->
    </div>

  </div>

  <footer>
    <strong>BookExchange</strong> &mdash; ENSE 281 Group Project &mdash; University of Regina
  </footer>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
