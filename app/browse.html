<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Listings - BookExchange</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">&#128218; Book<span>Exchange</span></a>
    <div class="nav-links">
      <a href="index.html" class="nav-icon-link" title="Home">&#127968;</a>
      <a href="browse.html" class="active">Search</a>
      <a href="post.html">Post</a>
      <a href="my-listings.html">My Listings</a>
      <a href="how-it-works.html">How It Works</a>
      <a href="safety-tips.html">Safety Tips</a>
      <a href="#" class="nav-icon-link" title="Account">&#128100;</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-header-inner">
      <h1>Browse Listings</h1>
      <p>Find textbooks by course code or title.</p>
    </div>
  </div>

  <div class="container">
    <div class="browse-layout">

      <!-- Sidebar Filters -->
      <aside class="filter-sidebar">
        <div class="filter-group">
          <label class="filter-label" for="dept-select">Department</label>
          <select id="dept-select" aria-label="Filter by department">
            <option value="all">All Departments</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="course-number-input">Course Number</label>
          <input type="text" id="course-number-input" placeholder="e.g. 101" autocomplete="off" aria-label="Filter by course number">
        </div>
        <div class="filter-group">
          <div class="filter-label">Condition</div>
          <label class="checkbox-label"><input type="checkbox" name="condition" value="New"> New</label>
          <label class="checkbox-label"><input type="checkbox" name="condition" value="Like New"> Like New</label>
          <label class="checkbox-label"><input type="checkbox" name="condition" value="Good"> Used</label>
          <label class="checkbox-label"><input type="checkbox" name="condition" value="Fair"> Bad</label>
          <label class="checkbox-label"><input type="checkbox" name="condition" value="Poor"> Bad Bad</label>
        </div>
        <div class="filter-group">
          <div class="filter-label">Price</div>
          <div class="price-range-labels">
            <span id="price-min-label">$0</span>
            <span id="price-max-label">$500</span>
          </div>
          <input type="range" id="price-max-range" min="0" max="500" value="500" step="5" class="price-range" aria-label="Maximum price">
        </div>
        <button class="btn btn-secondary btn-block" id="clear-filters-btn" onclick="clearBrowseFilters()" style="margin-top:0.5rem">Clear Filters</button>
      </aside>

      <!-- Main Content -->
      <div class="browse-main">
        <div class="browse-toolbar">
          <span class="results-count" id="results-count"></span>
          <a href="post.html" class="btn btn-primary btn-sm">+ Post a Book</a>
        </div>
        <div class="listings-grid" id="listings-grid">
          <!-- Populated by script.js -->
        </div>
      </div>

    </div>
  </div>

  <footer>
    <strong>BookExchange</strong> &mdash; ENSE 281 Group Project &mdash; University of Regina
  </footer>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
